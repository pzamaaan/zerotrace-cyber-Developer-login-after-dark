<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090d16">
  <title>{% block title %}ZeroTrace — Login After Dark{% endblock %}</title>
  
  <!-- Modern Clean Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body class="theme-dark">
  <div class="shell">
    <!-- Modular Sidebar Navigation -->
    {% include 'components/navbar.html' %}

    <div class="content-wrapper">
      <!-- Mobile Navigation Bar -->
      <header class="mobile-bar">
        <div class="mobile-brand">
          <div class="mark-icon-sm">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
          </div>
          <span>login<strong class="accent">after</strong>dark</span>
        </div>
        <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle Navigation">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </header>

      <!-- Main View Content -->
      <main class="main-content">
        {% block content %}{% endblock %}
      </main>

      <!-- Modular Status Footer -->
      {% include 'components/footer.html' %}
    </div>
  </div>

  <!-- Primary Application Script -->
  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
